[package]
name = "weavatrix-rust-refactor"
version = "0.1.6"
edition = "2024"
rust-version = "1.89"
description = "Evidence-backed refactor operations for Weavatrix: plan production, transactional application, and rollback"
license = "MIT"
repository = "https://github.com/sergii-ziborov/weavatrix-rust-refactor"
homepage = "https://weavatrix.com"
keywords = ["refactoring", "code-analysis", "rename", "transactional", "weavatrix"]
categories = ["development-tools"]
readme = "README.md"

[lib]
name = "weavatrix_rust_refactor"
path = "src/lib.rs"

[dependencies]
blazingly-json = "0.1.0"
# Pinned to the version weavatrix-rust resolves, so both see one graph type rather than two
# structurally identical ones that will not convert.
regex = "1"
weavatrix-graph = "0.6.3"
weavatrix-rust = { version = "2.5.1", features = ["full"] }
weavatrix-parse = "0.3.1"
weavatrix-refactor-plan = "0.1.1"
weavatrix-worktree = "0.2.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
